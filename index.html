<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hành Trình – tải app</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f6f8;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 28px 24px;
          max-width: 360px; width: 90%; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #555; margin: 0 0 20px; }
  a.btn { display: block; background: #1e88e5; color: #fff; text-decoration: none; font-weight: 600;
          padding: 14px; border-radius: 12px; }
  small { display: block; margin-top: 12px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>Hành Trình</h1>
  <p>Ghi lại hành trình và chia sẻ vị trí trực tiếp</p>
  <a class="btn" href="app/HanhTrinh.apk">Tải app (Android)</a>
  <small id="ver"></small>
</div>
<script>
fetch('app/update.json', { cache: 'no-store' }).then(r => r.json())
  .then(j => { document.getElementById('ver').textContent = 'Phiên bản ' + j.versionName; })
  .catch(() => {});
</script>
</body>
</html>
